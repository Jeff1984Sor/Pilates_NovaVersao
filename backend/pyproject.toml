[project]
name = "mayacorp-automacoes-api"
version = "0.1.0"
description = "MayaCorp Automações — API (core + RPA 01 NFS-e layout 2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.2",
    "python-multipart>=0.0.32",
    "reportlab>=5.1.0",
    "signxml>=5.2.0",
    "sqlalchemy>=2",
    "sse-starlette>=3.5.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
