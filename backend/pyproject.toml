[project]
name = "pilates-api"
version = "0.1.0"
description = "Pilates — API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "nh3>=0.3.7",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "django>=5.2,<5.3",
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
