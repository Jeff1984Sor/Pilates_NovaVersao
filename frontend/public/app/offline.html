<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#b0486b" />
  <title>Sem conexão</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; background: #faf7f8; color: #2a1a20; }
    @media (prefers-color-scheme: dark) { body { background: #151015; color: #f3e9ed; } }
    main { max-width: 22rem; }
    .icone { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 20px; background: #b0486b; display: grid; place-items: center; }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { margin: 0 0 20px; line-height: 1.5; opacity: .8; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 20px; background: #b0486b; color: #fff; min-height: 48px; }
  </style>
</head>
<body>
  <main>
    <div class="icone" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.86a10 10 0 0 1 14 0"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>Você está sem internet</h1>
    <p>Suas aulas só aparecem com conexão, para você ver sempre o horário certo. Conecte-se e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
